[project]
name = "africa-pulse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Oluwole Amos", email = "Amosquito33@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "httpx>=0.28.1",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
]

[project.scripts]
africa-pulse = "africa_pulse:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]
